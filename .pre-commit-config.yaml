---
minimum_pre_commit_version: "3.0.0"
default_install_hook_types: [pre-commit, commit-msg]

repos:
    - repo: https://github.com/betterleaks/betterleaks
      rev: v1.8.1
      hooks:
          - id: betterleaks

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]

    - repo: local
      hooks:
          - id: conventional-commit
            name: cog verify
            entry: cog verify --file
            language: system
            stages: [commit-msg]

          - id: fmt
            name: cargo fmt
            entry: cargo fmt --all --
            language: system
            types: [rust]
            pass_filenames: false

          - id: clippy
            name: cargo clippy
            entry: cargo clippy --all-targets --all-features -- -D warnings
            language: system
            types: [rust]
            pass_filenames: false

          - id: opengrep
            name: opengrep
            entry: opengrep scan --config auto --error --quiet
            language: system
            types: [rust]
            pass_filenames: false

          - id: zizmor
            name: zizmor
            entry: zizmor --offline
            language: system
            files: ^\.github/workflows/.*\.ya?ml$

          - id: oxfmt
            name: oxfmt
            entry: oxfmt -c .oxfmtrc.json .
            language: system
