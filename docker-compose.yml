---
services:
    postgres:
        image: postgres:18-alpine
        container_name: waxdemon-postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
        restart: unless-stopped
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp
            - /run
            - /var/run/postgresql
        healthcheck:
            test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5

    waxdemon:
        image: ghcr.io/rtuszik/waxdemon:latest
        build: .
        container_name: waxdemon
        ports:
            - "3000:3000"
        env_file: .env
        secrets:
            - source: oauth-keyring
              target: oauth-keyring.json
        depends_on:
            postgres:
                condition: service_healthy
        restart: unless-stopped
        read_only: true
        security_opt:
            - no-new-privileges:true
        tmpfs:
            - /tmp

volumes:
    postgres-data:

secrets:
    oauth-keyring:
        file: ${OAUTH_KEYRING_SOURCE:?OAUTH_KEYRING_SOURCE is required}
