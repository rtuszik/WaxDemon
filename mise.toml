[tools]
oxfmt = "0.64.0"
rust = "1.97.1"

[tasks]
fmt = { description = "Apply rustfmt, oxfmt across the workspace", run = "[cargo fmt --all, oxfmt]" }
fmt-check = { description = "Fail if rustfmt or oxfmt would change anything (CI parity)", run = "[cargo fmt --all -- --check, oxfmt --check]" }
clippy = { description = "Clippy with -D warnings across all targets", run = "cargo clippy --workspace --all-targets -- -D warnings" }
test = { description = "Run the full test suite. Needs TEST_DATABASE_URL for db-backed tests.", run = "cargo test --workspace -- --test-threads=1" }
ci = { description = "Full pre-push check: format, clippy, build, test", depends = "[fmt-check, clippy, test]" }
