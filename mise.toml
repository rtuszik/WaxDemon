#:schema https://mise.jdx.dev/schema/mise.json

[tools]
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-leptos" = "0.3.7"
cocogitto = "7.0.0"
opengrep = "latest"
oxfmt = "0.64.0"
rust = "1.97.1"
rust-analyzer = "latest"
zizmor = "latest"

[tasks.fmt]
description = "Apply rustfmt, oxfmt across the workspace"
run = ["cargo fmt --all", "oxfmt"]

[tasks.fmt-check]
description = "Fail if rustfmt or oxfmt would change anything (CI parity)"
run = ["cargo fmt --all -- --check", "oxfmt --check"]

[tasks."format:oxfmt"]
run = "oxfmt -c .oxfmtrc.json ."

[tasks.clippy]
description = "Clippy with -D warnings across all targets"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the full test suite. Needs TEST_DATABASE_URL for db-backed tests."
run = "cargo test --workspace -- --test-threads=1"

[tasks.ci]
description = "Full pre-push check: format, clippy, build, test"
depends = ["fmt-check", "clippy", "test", "frontend", "clippy-wasm"]

[tasks.frontend]
description = "Build the server and Rust/WASM browser assets"
run = ["rustup target add wasm32-unknown-unknown", "cargo leptos build"]

[tasks.clippy-wasm]
description = "Lint browser-only Rust code"
env.CARGO_TARGET_DIR = "target/front"
run = [
    "rustup target add wasm32-unknown-unknown",
    "cargo clippy -p waxdemon-app --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings",
]

[tasks.test-browser]
description = "Browser integration test; requires TEST_DATABASE_URL and WEBDRIVER_URL"
depends = ["frontend"]
env.LEPTOS_SITE_ROOT = "{{config_root}}/target/site"
run = "cargo test -p waxdemon-server --test authentication browser_hydration -- --ignored --test-threads=1"

[tasks.oauth-smoke]
description = "Interactive Discogs OAuth smoke test; no database required"
raw = true
run = "cargo run -p waxdemon-server --bin waxdemon-oauth-smoke"
