[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/discogs",
    "crates/sync",
    "crates/server",
    "crates/app",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/rtuszik/WaxDemon"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "cors", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
url = "2.5"

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "migrate",
    "macros",
] }

# Time
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Errors
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Misc
rand = "0.9"
async-trait = "0.1"

# Leptos
leptos = { version = "0.8" }
leptos_axum = "0.8"
leptos_meta = "0.8"
leptos_router = "0.8"
wasm-bindgen = "0.2"

# Testing
wiremock = "0.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[workspace.metadata.leptos]]
name = "waxdemon"
bin-package = "waxdemon-server"
bin-target = "waxdemon"
bin-exe-name = "waxdemon"
lib-package = "waxdemon-app"
output-name = "waxdemon"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
style-file = "crates/app/style.css"
lib-features = ["hydrate"]
lib-default-features = false
bin-default-features = true
disable-erase-components = true
