{{- $_ := required "config.PUBLIC_URL must be set to the public application origin" .Values.config.PUBLIC_URL -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "waxdemon.fullname" . }}-config
  labels:
    {{- include "waxdemon.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
