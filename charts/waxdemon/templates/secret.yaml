{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "waxdemon.fullname" . }}
  labels:
    {{- include "waxdemon.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.databaseUrl }}: {{ required "secrets.databaseUrl or secrets.existingSecret must be set — point the chart at a Postgres instance" .Values.secrets.databaseUrl | quote }}
  {{ .Values.secrets.keys.consumerKey }}: {{ required "secrets.consumerKey is required" .Values.secrets.consumerKey | quote }}
  {{ .Values.secrets.keys.consumerSecret }}: {{ required "secrets.consumerSecret is required" .Values.secrets.consumerSecret | quote }}
  {{ .Values.secrets.keys.oauthKeyring }}: {{ required "secrets.oauthKeyring is required" .Values.secrets.oauthKeyring | quote }}
{{- end }}
