[package]
name = "waxdemon-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "waxdemon"

[lib]
path = "src/lib.rs"

[[bin]]
name = "waxdemon"
path = "src/main.rs"

[[bin]]
name = "waxdemon-migrate-legacy"
path = "src/bin/migrate_legacy.rs"

[[bin]]
name = "waxdemon-oauth-smoke"
path = "src/bin/oauth_smoke.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
waxdemon-core = { path = "../core" }
waxdemon-db = { path = "../db" }
waxdemon-discogs = { path = "../discogs" }
waxdemon-sync = { path = "../sync" }
leptos = { workspace = true, features = ["ssr"] }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
secrecy = { version = "0.10.3", features = ["serde"] }
rpassword = { version = "7.5.4" }
axum-login = "0.18.0"
sha2 = "0.11.0"
time = "0.3.55"
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
sqlx.workspace = true
async-trait.workspace = true
subtle = "2.6.1"
hex = "0.4.3"
apalis = { version = "0.7.4", features = ["limit", "retry", "catch-panic"] }
apalis-sql = { version = "0.7.4", features = ["postgres", "tokio-comp"] }
leptos_axum.workspace = true
waxdemon-app = { version = "0.3.1", path = "../app", features = ["ssr"] }
any_spawner = { version = "0.3.0", features = ["tokio"] }

[dev-dependencies]
sqlx = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
