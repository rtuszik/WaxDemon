---
name: Helm Chart Lint

on:
    pull_request:
        paths:
            - "charts/**"
            - ".github/workflows/helm-lint.yml"
    workflow_dispatch:

concurrency:
    group: helm-lint-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Install Helm
              uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
              with:
                  version: v3.16.4

            - name: helm lint
              run: |
                  helm lint charts/waxdemon \
                      -f charts/waxdemon/ci/inline-values.yaml

            - name: helm template (inline secret + defaults)
              run: |
                  helm template waxdemon charts/waxdemon \
                      -f charts/waxdemon/ci/inline-values.yaml

            - name: helm template (existingSecret + ingress + autoscaling + httpRoute)
              run: |
                  helm template waxdemon charts/waxdemon \
                      --set secrets.existingSecret=waxdemon-secrets \
                      --set config.PUBLIC_URL=https://wax.example \
                      --set ingress.enabled=true \
                      --set autoscaling.enabled=true \
                      --set httpRoute.enabled=true

            - name: Reject missing authentication configuration
              run: |
                  if helm template waxdemon charts/waxdemon --set secrets.existingSecret=waxdemon-secrets; then
                    echo "Expected missing PUBLIC_URL to fail"
                    exit 1
                  fi
                  if helm template waxdemon charts/waxdemon --set config.PUBLIC_URL=https://wax.example --set secrets.databaseUrl=postgres://localhost/lint; then
                    echo "Expected missing OAuth secrets to fail"
                    exit 1
                  fi
