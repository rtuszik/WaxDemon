name: Rust CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    image-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
              with:
                  persist-credentials: false

            - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

            - name: Build release image without publishing
              uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
              with:
                  context: .
                  push: false
                  tags: waxdemon:ci
                  cache-from: type=gha,scope=image-validation
                  cache-to: type=gha,mode=max,scope=image-validation

    build-test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:18
                env:
                    POSTGRES_USER: ddtest
                    POSTGRES_PASSWORD: ddtest
                    POSTGRES_DB: waxdemon_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        env:
            TEST_DATABASE_URL: postgres://ddtest:ddtest@localhost:5432/waxdemon_test
            CARGO_TERM_COLOR: always
            CARGO_PROFILE_DEV_DEBUG: "0"
            CARGO_INCREMENTAL: "0"

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  persist-credentials: false

            - name: Rust toolchain
              uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # 1.97.0
              with:
                  toolchain: 1.97.0
                  components: rustfmt, clippy
                  targets: wasm32-unknown-unknown

            - name: Toolchain info
              run: rustc --version && cargo --version

            - name: Cache cargo
              uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

            - name: Format check
              run: cargo fmt --all -- --check

            - name: Build core
              run: cargo build -p waxdemon-core --verbose

            - name: Build discogs
              run: cargo build -p waxdemon-discogs --verbose

            - name: Build db
              run: cargo build -p waxdemon-db --verbose

            - name: Build sync
              run: cargo build -p waxdemon-sync --verbose

            - name: Build server
              run: cargo build -p waxdemon-server --verbose

            - name: Build tests
              run: cargo build --workspace --tests --verbose

            - name: Clippy
              run: cargo clippy --workspace --all-targets -- -D warnings

            - name: Wait for postgres
              run: |
                  for i in $(seq 1 30); do
                    if pg_isready -h localhost -p 5432 -U ddtest; then break; fi
                    echo "waiting for postgres ($i)"; sleep 2
                  done
                  pg_isready -h localhost -p 5432 -U ddtest

            - name: Test core
              run: cargo test -p waxdemon-core --verbose -- --test-threads=1

            - name: Test discogs
              run: cargo test -p waxdemon-discogs --verbose -- --test-threads=1

            - name: Test db
              run: cargo test -p waxdemon-db --verbose -- --test-threads=1

            - name: Test sync
              run: cargo test -p waxdemon-sync --verbose -- --test-threads=1

            - name: Test server
              run: cargo test -p waxdemon-server --verbose -- --test-threads=1

            - name: Test frontend logic
              run: cargo test -p waxdemon-app

            - name: Lint WASM
              run: cargo clippy -p waxdemon-app --target wasm32-unknown-unknown --no-default-features --features hydrate -- -D warnings

            - name: Build SSR and WASM assets
              run: |
                  cargo install cargo-leptos --version 0.3.7 --locked
                  cargo leptos build

            - name: Browser integration
              run: |
                  chromedriver --port=9515 --allowed-ips=127.0.0.1 > /tmp/waxdemon-chromedriver.log 2>&1 &
                  webdriver_pid=$!
                  trap 'kill "$webdriver_pid"' EXIT
                  for attempt in $(seq 1 30); do
                    if curl --fail --silent http://127.0.0.1:9515/status >/dev/null; then break; fi
                    sleep 1
                  done
                  export WEBDRIVER_URL=http://127.0.0.1:9515
                  export LEPTOS_SITE_ROOT="$PWD/target/site"
                  cargo test -p waxdemon-server --test authentication browser_hydration -- --ignored --test-threads=1
