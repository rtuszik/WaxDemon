---
name: Release

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: release-main
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    validate:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout pull request head
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}

            - name: Set up mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
              with:
                  version: 2026.8.12
                  install_args: "rust cargo:cargo-edit cocogitto"
                  env: false

            - name: Check Conventional Commits since the latest release
              run: cog check --from-latest-tag --ignore-merge-commits

    release:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            released: ${{ steps.plan.outputs.released }}
            version: ${{ steps.plan.outputs.version }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
              with:
                  version: 2026.8.12
                  install_args: "rust cargo:cargo-edit cocogitto"
                  env: false

            - name: Check Conventional Commits since the latest release
              run: cog check --from-latest-tag --ignore-merge-commits

            - name: Determine whether a release is needed
              id: plan
              run: |
                  current_version="$(cog -v get-version)"
                  target_version="$(cog bump --auto --dry-run | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$/\1/p' | tail -n 1)"

                  if [[ -z "$target_version" ]]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  if [[ "$target_version" == "$current_version" ]]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "released=true" >> "$GITHUB_OUTPUT"
                  echo "version=$target_version" >> "$GITHUB_OUTPUT"

            - name: Create version commit and tag
              if: steps.plan.outputs.released == 'true'
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  cog bump --auto --skip-ci

            - name: Push version commit and tag
              if: steps.plan.outputs.released == 'true'
              run: git push origin HEAD "refs/tags/v${{ steps.plan.outputs.version }}"

            - name: Create GitHub Release
              if: steps.plan.outputs.released == 'true'
              run: gh release create "v${{ steps.plan.outputs.version }}" --generate-notes
              env:
                  GH_TOKEN: ${{ github.token }}

    publish:
        needs: release
        if: needs.release.outputs.released == 'true'
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/publish.yml
        with:
            version: ${{ needs.release.outputs.version }}
        secrets: inherit
