---
name: Release

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            bump:
                description: Version bump
                type: choice
                default: auto
                options: [auto, major, minor, patch]

concurrency:
    group: release-main
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            released: ${{ steps.plan.outputs.released }}
            version: ${{ steps.plan.outputs.version }}

        steps:
            # credentials are required to push the version commit and tag
            - name: Checkout repository # zizmor: ignore[artipacked]
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0

            - name: Set up mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
              with:
                  version: 2026.8.12
                  install_args: "cocogitto"
                  env: false

            - name: Check Conventional Commits since the latest release
              run: cog check --from-latest-tag --ignore-merge-commits

            - name: Determine whether a release is needed
              id: plan
              env:
                  BUMP: ${{ inputs.bump || 'auto' }}
              run: |
                  case "$BUMP" in
                      auto|major|minor|patch) ;;
                      *) echo "Invalid bump: $BUMP" >&2; exit 1 ;;
                  esac
                  current_version="$(cog -v get-version)"
                  target_version="$(cog bump "--${BUMP}" --dry-run | sed -nE 's/^v?([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$/\1/p' | tail -n 1)"

                  if [[ -z "$target_version" ]]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  if [[ "$target_version" == "$current_version" ]]; then
                      echo "released=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  echo "released=true" >> "$GITHUB_OUTPUT"
                  echo "version=$target_version" >> "$GITHUB_OUTPUT"

            - name: Install version update tools
              if: steps.plan.outputs.released == 'true'
              run: mise install --locked rust cargo:cargo-edit

            - name: Create version commit and tag
              if: steps.plan.outputs.released == 'true'
              env:
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
                  cog bump --version "$RELEASE_VERSION" --skip-ci

            - name: Generate release notes
              if: steps.plan.outputs.released == 'true'
              env:
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}
              run: cog changelog --at "v${RELEASE_VERSION}" --template full_hash > "$RUNNER_TEMP/release-notes.md"

            - name: Push version commit and tag
              if: steps.plan.outputs.released == 'true'
              env:
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}
              run: git push --atomic origin HEAD:refs/heads/main "refs/tags/v${RELEASE_VERSION}"

            - name: Create GitHub Release
              if: steps.plan.outputs.released == 'true'
              run: gh release create "v${RELEASE_VERSION}" --verify-tag --notes-file "$RUNNER_TEMP/release-notes.md"
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_VERSION: ${{ steps.plan.outputs.version }}

    publish:
        needs: release
        if: needs.release.outputs.released == 'true'
        permissions:
            contents: read
            packages: write
        uses: $/.github/workflows/publish.yml
        with:
            version: ${{ needs.release.outputs.version }}
