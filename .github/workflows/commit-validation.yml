---
name: Commit validation

on:
    pull_request:

concurrency:
    group: commit-validation-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout pull request head
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.pull_request.head.sha }}
                  persist-credentials: false

            - name: Set up mise
              uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
              with:
                  version: 2026.8.12
                  install_args: "cocogitto"
                  env: false

            - name: Check Conventional Commits since the latest release
              run: cog check --from-latest-tag --ignore-merge-commits
